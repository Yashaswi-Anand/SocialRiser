name: Build and publish static site

# Hostinger's Git integration only clones a branch — it never runs a build.
# So this workflow builds the site and pushes the contents of out/ to a
# dedicated `deploy` branch, where index.html sits at the branch root.
# Point Hostinger's Git deployment at `deploy` instead of `master`.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Fail if the export is empty
        run: test -f out/index.html && test -f out/.htaccess

      - name: Push out/ to the deploy branch
        working-directory: out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build from ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
